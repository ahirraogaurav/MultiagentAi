
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Research Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #151b2b;
            border: 1px solid #293247;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 54px;
            height: 54px;
            border-radius: 15px;
            background: #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e5e7eb;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #374151;
            border-radius: 9px;
            background: #0f1422;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 14px;
            margin-top: 5px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #4f46e5;
        }

        .error {
            background: #3b1720;
            border: 1px solid #7f1d1d;
            color: #fecaca;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #9ca3af;
            font-size: 14px;
        }

        a {
            color: #a5b4fc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
        .password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 46px;
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: #9ca3af;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.toggle-password:hover {
    color: #e5e7eb;
}

.toggle-password:focus-visible {
    outline: 2px solid #818cf8;
}

.toggle-password svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

        @media (max-width: 480px) {
            .container {
                padding: 26px 22px;
            }
        }
        

    </style>
</head>

<body>
    <main class="container">
        <div class="logo">✦</div>

        <h1>Welcome Back</h1>
        <p class="subtitle">
            Sign in to continue to your AI Research Assistant.
        </p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'chat:login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="email">Username or Email</label>
                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="Enter username or email"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Sign In
            </button>
        </form>

        <p class="footer">
            Don't have an account?
            <a href="{% url 'chat:register' %}">Create account</a>
        </p>
    </main>
    <script>
    const EYE = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const EYE_OFF = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

    document.querySelectorAll('input[type="password"]').forEach(function (input) {
        // Wrap the input
        const wrapper = document.createElement('div');
        wrapper.className = 'password-wrapper';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);

        // Create the toggle button
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toggle-password';
        btn.setAttribute('aria-label', 'Show password');
        btn.innerHTML = EYE;
        wrapper.appendChild(btn);

        btn.addEventListener('click', function () {
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.innerHTML = show ? EYE_OFF : EYE;
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    });
</script>
</body>
</html>
