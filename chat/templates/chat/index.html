{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
  <link rel="stylesheet" href="{% static 'chat/style.css' %}">
</head>
<body>
<div class="app" id="app">

  <button class="icon-btn toggle-fixed" id="collapse" title="Toggle sidebar" aria-label="Toggle sidebar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
  </button>

  <aside class="sidebar" id="sidebar">
    <div class="side-top"><span class="brand">Agent Chat</span></div>

    <nav class="nav">
      <button class="nav-item" id="new-chat" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
      <button class="nav-item" id="search-btn" data-view="search" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search</span><kbd>Ctrl+Shift+K</kbd></button>
      <button class="nav-item" data-view="projects" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M6 4h12M5 12h14v8H5z"/></svg><span>Projects</span></button>
      <button class="nav-item" data-view="artifacts" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h9a2 2 0 0 1 2 2v9"/><rect x="3" y="8" width="12" height="12" rx="2"/></svg><span>Artifacts</span></button>
      <button class="nav-item" data-view="customize" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Customize</span></button>
    </nav>

    <div class="list-head">
      <button class="list-title" id="list-toggle" type="button">Chats and tasks
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h16l-8 9z"/></svg>
      </button>
      <button class="icon-btn" id="sort-btn" type="button" title="Sort A–Z / Recent" aria-label="Sort chats"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
    </div>
    <nav class="convs" id="convs"></nav>

    <div class="side-bottom">
      <div class="menu user-menu" id="user-menu" hidden>
        <div class="menu-email">{{ user_email }}</div>
        <button type="button" id="settings"><svg class="mi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
        <button type="button" id="theme"><svg class="mi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Toggle theme</button>
        <button type="button" id="language"><svg class="mi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Language</button>
        <button type="button" id="help"><svg class="mi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5M12 17h.01"/></svg>Get help</button>
        <hr>
        
        <button type="button" id="learn"><svg class="mi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Learn more</button>
        <hr>
        
<form method="POST" action="{% url 'chat:logout' %}" id="logoutForm">
    {% csrf_token %}
    <button type="submit" id="logout">
        <svg class="mi" width="18" height="18"
             viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        Log out
    </button>
</form>


      </div>

      <button class="user-btn" id="user-btn" type="button" aria-haspopup="menu">
        <span class="avatar">{{ user_name|slice:":1"|upper }}</span>
        <span class="uname">{{ user_name }}</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title-wrap">
        <button class="title-btn" id="title-btn" type="button">
          <span id="chat-title"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="menu title-menu" id="title-menu" hidden>
          <button id="rename" type="button">Rename</button>
          <button id="delete-chat" type="button">Delete</button>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="export" type="button" title="Export as Markdown" aria-label="Export chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        </button>
        <button class="share" id="share" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V4M8 8l4-4 4 4M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg>
          <span>Share</span>
        </button>
      </div>
    </header>

    <section class="scroll" id="scroll">
      <div class="empty" id="empty">
        <h1>How can I help you today?</h1>
        <p>Pick an agent below, or leave it on Auto and let the orchestrator choose.</p>
      </div>
      <div class="thread" id="thread"></div>
    </section>

    <div class="composer-wrap">
      <div class="proj-chip" id="proj-chip" hidden></div>
      <div class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Message the agents…" autofocus></textarea>
        <div class="composer-row">
          
<button type="button" class="icon-btn" id="voice-btn"
        title="Speak your message" aria-label="Start voice input">
    <svg width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <path d="M12 17v5M8 22h8"/>
    </svg>
</button>

          <button class="send" id="send" aria-label="Send" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="hint">AI can make mistakes. Check important information.</div>
    </div>
    <section class="page" id="page"></section>
  </main>
</div>

<dialog class="modal" id="modal"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="{% static 'chat/app.js' %}"></script>
</body>
</html>
