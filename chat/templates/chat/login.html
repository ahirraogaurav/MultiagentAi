
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Research Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #151b2b;
            border: 1px solid #293247;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 54px;
            height: 54px;
            border-radius: 15px;
            background: #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e5e7eb;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #374151;
            border-radius: 9px;
            background: #0f1422;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 14px;
            margin-top: 5px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #4f46e5;
        }

        .error {
            background: #3b1720;
            border: 1px solid #7f1d1d;
            color: #fecaca;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #9ca3af;
            font-size: 14px;
        }

        a {
            color: #a5b4fc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 26px 22px;
            }
        }
        

    </style>
</head>

<body>
    <main class="container">
        <div class="logo">✦</div>

        <h1>Welcome Back</h1>
        <p class="subtitle">
            Sign in to continue to your AI Research Assistant.
        </p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'chat:login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="email">Username or Email</label>
                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="Enter username or email"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Sign In
            </button>
        </form>

        <p class="footer">
            Don't have an account?
            <a href="{% url 'chat:register' %}">Create account</a>
        </p>
    </main>
</body>
</html>
